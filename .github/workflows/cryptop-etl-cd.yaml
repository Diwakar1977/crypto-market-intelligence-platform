# =============================================================================
# Crypto Market Intelligence Platform - Production CD Pipeline
# =============================================================================
# Deploys the exact commit that successfully passed the CI Pipeline.
#
# CD responsibilities:
#   1. Download the CI-approved commit
#   2. Authenticate to AWS using GitHub Actions OIDC
#   3. Upload production requirements to MWAA S3
#   4. Build and upload MWAA plugins.zip
#   5. Upload Airflow DAGs
#   6. Verify the production S3 deployment
#
# Production deployment is allowed only after CI succeeds on main.
# =============================================================================

name: Production CD Pipeline


# =============================================================================
# TRIGGERS
# =============================================================================

on:
  workflow_run:
    workflows:
      - "CI Pipeline"
    types:
      - completed


# =============================================================================
# GLOBAL PERMISSIONS
# =============================================================================

permissions:
  id-token: write
  contents: read


# =============================================================================
# GLOBAL ENVIRONMENT VARIABLES
# =============================================================================

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}


# =============================================================================
# DEPLOYMENT JOB
# =============================================================================

jobs:

  deploy:

    name: "Deploy to Production S3"

    # -------------------------------------------------------------------------
    # Deploy only when:
    #   - CI Pipeline completed successfully
    #   - CI was triggered from main
    # -------------------------------------------------------------------------

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    # -------------------------------------------------------------------------
    # GitHub Environment
    #
    # If production environment protection is configured,
    # GitHub will require approval before this job proceeds.
    # -------------------------------------------------------------------------

    environment:
      name: production

    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-24.04


    # =========================================================================
    # STEPS
    # =========================================================================

    steps:

      # -----------------------------------------------------------------------
      # 1. Checkout the exact commit approved by CI
      # -----------------------------------------------------------------------

      - name: "Checkout CI-approved commit"

        uses: actions/checkout@v6

        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1


      # -----------------------------------------------------------------------
      # 2. Configure AWS credentials using GitHub OIDC
      # -----------------------------------------------------------------------

      - name: "Configure AWS credentials"

        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # -----------------------------------------------------------------------
      # 3. Verify AWS authentication
      # -----------------------------------------------------------------------

      - name: "Verify AWS authentication"

        run: |
          set -euo pipefail

          aws sts get-caller-identity


      # -----------------------------------------------------------------------
      # 4. Verify S3 bucket access
      # -----------------------------------------------------------------------

      - name: "Verify S3 bucket access"

        run: |
          set -euo pipefail

          aws s3 ls "s3://${S3_BUCKET}/"


      # -----------------------------------------------------------------------
      # 5. Upload production Python requirements
      #
      # MWAA reads requirements.txt from the configured S3 location.
      # -----------------------------------------------------------------------

      - name: "Upload production requirements"

        run: |
          set -euo pipefail

          aws s3 cp \
            requirements/requirements.txt \
            "s3://${S3_BUCKET}/requirements.txt"


      # -----------------------------------------------------------------------
      # 6. Build MWAA plugins.zip
      #
      # IMPORTANT:
      #
      # Your current MWAA environment loads application code from:
      #
      #     /usr/local/airflow/plugins/
      #
      # Therefore src/ and config/ must be included inside plugins.zip.
      #
      # Result:
      #
      # plugins.zip
      # ├── src/
      # │   ├── __init__.py
      # │   ├── extract/
      # │   ├── transform/
      # │   ├── load/
      # │   ├── notifications/
      # │   ├── schema/
      # │   ├── storage/
      # │   └── utils/
      # │
      # └── config/
      #     ├── __init__.py
      #     └── config.py
      #
      # This allows:
      #
      #     from src.notifications.sns_notification import SNSNotification
      #
      # and:
      #
      #     from config.config import CONFIG
      #
      # to resolve inside MWAA.
      # -----------------------------------------------------------------------

      - name: "Build MWAA plugins package"

        run: |
          set -euo pipefail

          rm -rf build/plugins
          rm -f build/plugins.zip

          mkdir -p build/plugins/src
          mkdir -p build/plugins/config

          # Copy application source code
          cp -r src/. build/plugins/src/

          # Copy application configuration package
          cp config/__init__.py build/plugins/config/
          cp config/config.py build/plugins/config/

          # Remove Python cache files from the deployment package
          find build/plugins -type d -name "__pycache__" -prune -exec rm -rf {} +
          find build/plugins -type f -name "*.pyc" -delete

          # Create plugins.zip with src/ and config/ at the ZIP root
          cd build/plugins

          zip -r ../plugins.zip \
            src \
            config

          cd ../..

          echo "=============================================="
          echo "MWAA plugins.zip created"
          echo "=============================================="

          unzip -l build/plugins.zip


      # -----------------------------------------------------------------------
      # 7. Upload plugins.zip to MWAA S3
      #
      # IMPORTANT:
      #
      # This must match the S3 path configured in the MWAA environment.
      #
      # If MWAA is configured with:
      #
      #     plugins.zip
      #
      # then this upload is correct.
      # -----------------------------------------------------------------------

      - name: "Upload MWAA plugins package"

        run: |
          set -euo pipefail

          aws s3 cp \
            build/plugins.zip \
            "s3://${S3_BUCKET}/plugins.zip"


      # -----------------------------------------------------------------------
      # 8. Upload Airflow DAGs
      #
      # Local:
      #
      #     dags/
      #
      # S3:
      #
      #     s3://<bucket>/dags/
      #
      # MWAA reads DAGs from the configured DAGs S3 path.
      # -----------------------------------------------------------------------

      - name: "Upload Airflow DAGs"

        run: |
          set -euo pipefail

          aws s3 sync \
            dags/ \
            "s3://${S3_BUCKET}/dags/" \
            --delete


      # -----------------------------------------------------------------------
      # 9. Verify production S3 deployment
      # -----------------------------------------------------------------------

      - name: "Verify S3 deployment"

        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Checking production deployment..."
          echo "=============================================="


          echo ""
          echo "Checking requirements.txt..."

          aws s3 ls \
            "s3://${S3_BUCKET}/requirements.txt"


          echo ""
          echo "Checking plugins.zip..."

          aws s3 ls \
            "s3://${S3_BUCKET}/plugins.zip"


          echo ""
          echo "Checking Airflow DAGs..."

          aws s3 ls \
            "s3://${S3_BUCKET}/dags/" \
            --recursive


          echo ""
          echo "=============================================="
          echo "S3 deployment verification completed"
          echo "=============================================="


      # -----------------------------------------------------------------------
      # 10. Deployment summary
      # -----------------------------------------------------------------------

      - name: "Deployment summary"

        run: |
          echo ""
          echo "=============================================="
          echo "PRODUCTION S3 DEPLOYMENT SUCCESS"
          echo "=============================================="
          echo ""
          echo "Bucket      : ${S3_BUCKET}"
          echo "Region      : ${AWS_REGION}"
          echo "Requirements: requirements.txt"
          echo "Plugins     : plugins.zip"
          echo "DAGs        : dags/"
          echo "Commit      : ${{ github.event.workflow_run.head_sha }}"
          echo ""
          echo "=============================================="