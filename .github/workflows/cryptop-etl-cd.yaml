# =============================================================================
# Crypto Market Intelligence Platform - Production CD Pipeline
# =============================================================================
# Deploys the exact commit that passed CI successfully.
#
# CD does:
#   1. Checkout the CI-approved commit
#   2. Connect to AWS using GitHub OIDC
#   3. Upload production requirements
#   4. Build and upload crypto_etl_spark.zip
#   5. Upload Airflow DAGs
#   6. Verify the S3 deployment
# =============================================================================

name: Production CD Pipeline


# =============================================================================
# TRIGGER
# =============================================================================

on:
  workflow_run:
    workflows:
      - "CI Pipeline"
    types:
      - completed


# =============================================================================
# PERMISSIONS
# =============================================================================

permissions:
  id-token: write
  contents: read


# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}


# =============================================================================
# DEPLOYMENT JOB
# =============================================================================

jobs:

  deploy:

    name: "Deploy to Production S3"

    # Deploy only when CI succeeds on main.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    # Production environment can require manual approval.
    environment:
      name: production

    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-24.04


    steps:

      # -----------------------------------------------------------------------
      # 1. Checkout the exact commit that passed CI
      # -----------------------------------------------------------------------

      - name: "Checkout CI-approved commit"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1


      # -----------------------------------------------------------------------
      # 2. Connect to AWS using GitHub OIDC
      # -----------------------------------------------------------------------

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # -----------------------------------------------------------------------
      # 3. Check AWS authentication
      # -----------------------------------------------------------------------

      - name: "Verify AWS authentication"
        run: |
          set -euo pipefail
          aws sts get-caller-identity


      # -----------------------------------------------------------------------
      # 4. Check S3 bucket access
      # -----------------------------------------------------------------------

      - name: "Verify S3 bucket access"
        run: |
          set -euo pipefail
          aws s3 ls "s3://${S3_BUCKET}/"


      # -----------------------------------------------------------------------
      # 5. Upload production requirements
      # -----------------------------------------------------------------------

      - name: "Upload production requirements"
        run: |
          set -euo pipefail

          aws s3 cp \
            requirements/requirements.txt \
            "s3://${S3_BUCKET}/requirements.txt"


      # -----------------------------------------------------------------------
      # 6. Build crypto_etl_spark.zip
      #
      # Only src/ is packaged.
      #
      # Production configuration comes from the Airflow Variable:
      #
      #     crypto_etl_config
      #
      # Therefore config/ is NOT included separately.
      # -----------------------------------------------------------------------

      - name: "Build EMR Spark package"
        run: |
          set -euo pipefail

          rm -rf build/crypto_etl_spark
          rm -f build/crypto_etl_spark.zip

          mkdir -p build/crypto_etl_spark

          # Copy application source code
          cp -r src build/crypto_etl_spark/

          # Remove Python cache files
          find build/crypto_etl_spark \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find build/crypto_etl_spark \
            -type f \
            -name "*.pyc" \
            -delete

          # Create crypto_etl_spark.zip
          cd build/crypto_etl_spark

          zip -r ../crypto_etl_spark.zip \
            src

          cd ../..

          echo "crypto_etl_spark.zip created"

          unzip -l build/crypto_etl_spark.zip


      # -----------------------------------------------------------------------
      # 7. Upload crypto_etl_spark.zip
      # -----------------------------------------------------------------------

      - name: "Upload EMR Spark package"
        run: |
          set -euo pipefail

          aws s3 cp \
            build/crypto_etl_spark.zip \
            "s3://${S3_BUCKET}/spark/crypto_etl_spark.zip"


      # -----------------------------------------------------------------------
      # 8. Upload Airflow DAGs
      # -----------------------------------------------------------------------

      - name: "Upload Airflow DAGs"
        run: |
          set -euo pipefail

          aws s3 sync \
            dags/ \
            "s3://${S3_BUCKET}/dags/" \
            --delete


      # -----------------------------------------------------------------------
      # 9. Verify deployment
      # -----------------------------------------------------------------------

      - name: "Verify S3 deployment"
        run: |
          set -euo pipefail

          echo "Checking requirements.txt..."
          aws s3 ls \
            "s3://${S3_BUCKET}/requirements.txt"

          echo "Checking crypto_etl_spark.zip..."
          aws s3 ls \
            "s3://${S3_BUCKET}/spark/crypto_etl_spark.zip"

          echo "Checking Airflow DAGs..."
          aws s3 ls \
            "s3://${S3_BUCKET}/dags/" \
            --recursive

          echo "S3 deployment verification completed"


      # -----------------------------------------------------------------------
      # 10. Deployment summary
      # -----------------------------------------------------------------------

      - name: "Deployment summary"

        run: |
          echo "=============================================="
          echo "PRODUCTION DEPLOYMENT SUCCESS"
          echo "=============================================="
          echo "Bucket      : ${S3_BUCKET}"
          echo "Region      : ${AWS_REGION}"
          echo "Requirements: requirements.txt"
          echo "Spark       : spark/crypto_etl_spark.zip"
          echo "DAGs        : dags/"
          echo "Commit      : ${{ github.event.workflow_run.head_sha }}"
          echo "=============================================="