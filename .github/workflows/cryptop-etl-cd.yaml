# =============================================================================
# Crypto Market Intelligence Platform - Production CD Pipeline
# =============================================================================
# Deploys the exact commit that passed CI successfully.
#
# CD does:
#   1. Checkout the CI-approved commit
#   2. Connect to AWS using GitHub OIDC
#   3. Upload production requirements
#   4. Upload application source code
#   5. Upload Airflow DAGs
#   6. Verify the S3 deployment
# =============================================================================

name: Production CD Pipeline


# =============================================================================
# TRIGGER
# =============================================================================

on:
  workflow_run:
    workflows:
      - "CI Pipeline"
    types:
      - completed


# =============================================================================
# PERMISSIONS
# =============================================================================

permissions:
  id-token: write
  contents: read


# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}


# =============================================================================
# DEPLOYMENT JOB
# =============================================================================

jobs:

  deploy:

    name: "Deploy to Production S3"

    # Deploy only when CI succeeds on main.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    # Production environment can require manual approval.
    environment:
      name: production

    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-24.04


    steps:

      # -----------------------------------------------------------------------
      # 1. Checkout the exact commit that passed CI
      # -----------------------------------------------------------------------

      - name: "Checkout CI-approved commit"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1


      # -----------------------------------------------------------------------
      # 2. Connect to AWS using GitHub OIDC
      # -----------------------------------------------------------------------

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # -----------------------------------------------------------------------
      # 3. Check AWS authentication
      # -----------------------------------------------------------------------

      - name: "Verify AWS authentication"
        run: |
          set -euo pipefail

          aws sts get-caller-identity


      # -----------------------------------------------------------------------
      # 4. Check S3 bucket access
      # -----------------------------------------------------------------------

      - name: "Verify S3 bucket access"
        run: |
          set -euo pipefail

          aws s3 ls "s3://${S3_BUCKET}/"


      # -----------------------------------------------------------------------
      # 5. Upload production requirements
      # -----------------------------------------------------------------------

      - name: "Upload production requirements"
        run: |
          set -euo pipefail

          aws s3 cp \
            requirements/requirements.txt \
            "s3://${S3_BUCKET}/requirements.txt"


      # -----------------------------------------------------------------------
      # 6. Upload application source code
      #
      # The complete src/ directory is uploaded to the production S3 bucket.
      #
      # Production configuration is provided through the Airflow Variable:
      #
      #     crypto_etl_config
      #
      # Therefore no separate configuration file is uploaded by CD.
      # -----------------------------------------------------------------------

      - name: "Upload application source code"
        run: |
          set -euo pipefail

          aws s3 sync \
            src/ \
            "s3://${S3_BUCKET}/src/" \
            --delete


      # -----------------------------------------------------------------------
      # 7. Upload Airflow DAGs
      # -----------------------------------------------------------------------

      - name: "Upload Airflow DAGs"
        run: |
          set -euo pipefail

          aws s3 sync \
            dags/ \
            "s3://${S3_BUCKET}/dags/" \
            --delete


      # -----------------------------------------------------------------------
      # 8. Verify requirements.txt
      # -----------------------------------------------------------------------

      - name: "Verify requirements deployment"
        run: |
          set -euo pipefail

          echo "Checking requirements.txt..."

          aws s3 ls \
            "s3://${S3_BUCKET}/requirements.txt"


      # -----------------------------------------------------------------------
      # 9. Verify src/
      # -----------------------------------------------------------------------

      - name: "Verify source deployment"
        run: |
          set -euo pipefail

          echo "Checking src/..."

          aws s3 ls \
            "s3://${S3_BUCKET}/src/" \
            --recursive


      # -----------------------------------------------------------------------
      # 10. Verify dags/
      # -----------------------------------------------------------------------

      - name: "Verify DAG deployment"
        run: |
          set -euo pipefail

          echo "Checking dags/..."

          aws s3 ls \
            "s3://${S3_BUCKET}/dags/" \
            --recursive

          echo "S3 deployment verification completed"


      # -----------------------------------------------------------------------
      # 11. Deployment summary
      # -----------------------------------------------------------------------

      - name: "Deployment summary"

        run: |
          echo "=============================================="
          echo "PRODUCTION DEPLOYMENT SUCCESS"
          echo "=============================================="
          echo "Bucket      : ${S3_BUCKET}"
          echo "Region      : ${AWS_REGION}"
          echo "Requirements: requirements.txt"
          echo "Source      : src/"
          echo "DAGs        : dags/"
          echo "Commit      : ${{ github.event.workflow_run.head_sha }}"
          echo "=============================================="