name: AWS OIDC Test

on:
  push: 
    branches: 
    - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::103021623716:role/CryptoETL-GitHubActions-Role
          aws-region: ap-south-1

      - name: Test AWS identity
        run: aws sts get-caller-identity
