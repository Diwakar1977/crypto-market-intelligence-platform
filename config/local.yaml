# APPLICATION
application:
  name: crypto_market_intelligence
  pipeline_name: crypto_market_etl
  source_system: coingecko
  target_table: crypto_market
  raw_dataset: crypto_market

# AWS
aws:
  region: ap-south-1

# COINGECKO
coingecko:
  base_url: "https://api.coingecko.com/api/v3/coins/markets"
  vs_currency: usd
  api_key: "CG-CXwi9FsBCiKduECBiUNzgmrF"

# S3
s3:
  bucket: crypto-etl-dev
  raw_prefix: raw_data
  processed_prefix: processed_data

# SPARK
spark:
  master: "local[*]"
  driver_memory: 4g
  executor_memory: 4g
  shuffle_partitions: 200

# HADOOP
hadoop:
  aws_package: "org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262"

# SNS
sns:
  topic_arn: arn:aws:sns:ap-south-1:103021623716:crypto-etl-dev-notifications

# REDSHIFT
redshift:
  host: crypto-etl-dev-wg.103021623716.ap-south-1.redshift-serverless.amazonaws.com
  port: 5439
  database: dev
  schema: public
  table: crypto_market
  workgroup: crypto-etl-dev-wg
  iam_role: arn:aws:iam::103021623716:role/Crypto-ETL-Redshift-Role

# EMR
emr:
  cluster_name: crypto-etl-cluster
  release: emr-7.13.0
  service_role: CryptoETL-EMR-Service-Role
  ec2_role: CryptoETL-EMR-EC2-Role
  instance_profile: CryptoETL-EMR-EC2-InstanceProfile
  subnet_id: subnet-0005874f9267d223d
  security_group_id: sg-00caa5ea769d640cb
  service_access_security_group_id: sg-08057e1aa934b388c
  master_instance_type: m5.xlarge
  core_instance_type: m5.xlarge
  core_instance_count: 1
  log_uri: "s3://crypto-etl-prod-data-ap-south-1/emr-logs/"

# RUNTIME
runtime:
  compute_mode: emr
  timezone: UTC
  dry_run: false
  log_level: INFO
  log_dir: logs